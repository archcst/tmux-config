# =============================================================================
# Tmux 快捷键配置
# =============================================================================
# 模式架构：
#   默认     → root 键表（无前缀）
#   主模式   → prefix 键表（C-a 进入）
#   窗口     → C-a p     标签页 → C-a t     会话   → C-a o
#   滚动     → C-a s     移动   → C-a m     调整大小 → C-a r
#   搜索     → C-a /
# =============================================================================

# --- 覆盖插件自动绑定的按键，避免冲突 ---
# 在 tpm 加载之前设置，插件会使用这里指定的非冲突键
set -g @floax-bind 'F20'
set -g @thumbs-key 'C-Space'

# --- 清空所有默认 prefix 键绑定 ---
unbind-key -a
set -g prefix ^A
set -g status-keys emacs
setw -g mode-keys vi

# ── TPM 插件管理（必须在 unbind-key -a 之后重新绑定）──
bind I run-shell '~/.config/tmux/plugins/tpm/bin/install_plugins'
bind U run-shell '~/.config/tmux/plugins/tpm/bin/update_plugins'
bind M-u run-shell '~/.config/tmux/plugins/tpm/bin/clean_plugins'

# =============================================================================
# 主模式（prefix 键表，C-a 进入）
# =============================================================================

# 双击 C-a 向终端发送 C-a
bind C-a send-prefix

# 分离 / 退出
bind q detach-client
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# 重载配置
bind R source-file ~/.config/tmux/tmux.conf \; display-message " Configuration reloaded."

# ── 子模式入口 ──
bind p switch-client -T pane
bind t switch-client -T tab
bind o switch-client -T session
bind s copy-mode -H
bind / copy-mode
bind m switch-client -T move
bind r switch-client -T resize

# ── 快速面板导航 ──
bind -r C-h select-pane -L
bind -r C-l select-pane -R
bind -r C-j select-pane -D
bind -r C-k select-pane -U

# ── 实用工具 ──
bind ? list-keys
bind : command-prompt -p " ❯"
bind C-r refresh-client
bind K send-keys "clear"\; send-keys "Enter"
bind * list-clients
bind x lock-server

# ── 快速面板操作 ──
bind C-x kill-pane                # 关闭当前面板
bind f resize-pane -Z          # 切换全屏
bind -r = resize-pane -U 5     # 快速增大高度
bind -r - resize-pane -D 5     # 快速减小高度

# ── 浮动终端（floax 插件）──
bind C-w run-shell ~/.tmux/plugins/tmux-floax/scripts/floax.sh

# ── 快速标签页导航 ──
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind Tab last-window
bind -r l next-window
bind -r h previous-window

# ── 标签页选择器 ──
bind Space choose-tree -w

# =============================================================================
# 窗口模式（C-a p）
# =============================================================================

bind -T pane Escape switch-client -T root
bind -T pane Enter  switch-client -T root

# 新建面板
bind -T pane n { split-window -h -c "#{pane_current_path}"; switch-client -T root }
bind -T pane N { split-window -v -c "#{pane_current_path}"; switch-client -T root }

# 移动焦点（留在窗口模式）
bind -T pane h { select-pane -L; switch-client -T pane }
bind -T pane l { select-pane -R; switch-client -T pane }
bind -T pane j { select-pane -D; switch-client -T pane }
bind -T pane k { select-pane -U; switch-client -T pane }

# 关闭面板
bind -T pane x { kill-pane; switch-client -T root }

# 重命名面板
bind -T pane r { command-prompt -p "Tab name:" "select-pane -T '%%'"; switch-client -T root }

# 切换布局
bind -T pane o { next-layout; switch-client -T pane }
bind -T pane O { previous-layout; switch-client -T pane }

# 将面板拆出为独立标签页
bind -T pane T { break-pane -d -a; switch-client -T root }
bind -T pane L { break-pane -d -a; switch-client -T root }
bind -T pane H { break-pane -d -b; switch-client -T root }

# 切换浮动
bind -T pane e { run-shell ~/.tmux/plugins/tmux-floax/scripts/floax.sh; switch-client -T root }

# 切换面板边框显示
bind -T pane f { if-shell -F '#{pane-border-status}' \
  'set -g pane-border-status off' \
  'set -g pane-border-status top'; switch-client -T root }

# =============================================================================
# 标签页模式（C-a t）
# =============================================================================

bind -T tab Escape switch-client -T root
bind -T tab Enter  switch-client -T root

bind -T tab h { previous-window; switch-client -T tab }
bind -T tab l { next-window; switch-client -T tab }

bind -T tab n { new-window -c "#{pane_current_path}" }
bind -T tab N { new-window -c "#{pane_current_path}"; \
  command-prompt -p "Tab name:" "rename-window '%%'"; switch-client -T root }

bind -T tab x { kill-window; switch-client -T root }
bind -T tab X { kill-window; switch-client -T tab }

bind -T tab r { command-prompt -p "Tab name:" "rename-window '%%'"; switch-client -T root }

# 切换同步输入
bind -T tab s { setw synchronize-panes; switch-client -T root }

# =============================================================================
# 会话模式（C-a o）
# =============================================================================

bind -T session Escape switch-client -T root

bind -T session x kill-session
bind -T session d detach-client
bind -T session r command-prompt -I "#S" "rename-session '%%'"

# 原生会话选择器
bind -T session w { choose-session; switch-client -T root }

# 布局选择菜单
bind -T session l { 
  display-menu -T '#[align=centre]布局' \
    '水平均分'   l 'select-layout even-horizontal' \
    '垂直均分'   v 'select-layout even-vertical' \
    '主窗水平'   h 'select-layout main-horizontal' \
    '主窗垂直'   j 'select-layout main-vertical' \
    '平铺'       t 'select-layout tiled' \
    '' \
    '取消'       q 'switch-client -T root' \
  ; switch-client -T root }

# 会话选择器
bind -T session s { choose-session; switch-client -T root }

# 新建会话
bind -T session n { command-prompt -p "Session name:" "new-session -s '%%' -c '#{pane_current_path}'"; switch-client -T root }

# 切换会话
bind -T session o { switch-client -p; switch-client -T root }

# =============================================================================
# 移动模式（C-a m）── 交换面板位置
# =============================================================================

bind -T move Escape switch-client -T root
bind -T move Enter  switch-client -T root

bind -T move h { run-shell "target=\$(tmux display -pt '{left-of}'  '##{pane_id}' 2>/dev/null); [ -n \"\$target\" ] && tmux swap-pane -s '#{pane_id}' -t \"\$target\""; switch-client -T move }
bind -T move l { run-shell "target=\$(tmux display -pt '{right-of}' '##{pane_id}' 2>/dev/null); [ -n \"\$target\" ] && tmux swap-pane -s '#{pane_id}' -t \"\$target\""; switch-client -T move }
bind -T move j { run-shell "target=\$(tmux display -pt '{down-of}'  '##{pane_id}' 2>/dev/null); [ -n \"\$target\" ] && tmux swap-pane -s '#{pane_id}' -t \"\$target\""; switch-client -T move }
bind -T move k { run-shell "target=\$(tmux display -pt '{up-of}'    '##{pane_id}' 2>/dev/null); [ -n \"\$target\" ] && tmux swap-pane -s '#{pane_id}' -t \"\$target\""; switch-client -T move }

# =============================================================================
# 调整大小模式（C-a r）
# =============================================================================

bind -T resize Escape switch-client -T root
bind -T resize Enter  switch-client -T root

# 增大
bind -T resize h { resize-pane -L 5; switch-client -T resize }
bind -T resize j { resize-pane -D 5; switch-client -T resize }
bind -T resize k { resize-pane -U 5; switch-client -T resize }
bind -T resize l { resize-pane -R 5; switch-client -T resize }

# 缩小（tmux resize-pane 只能增大，缩小通过设置绝对尺寸实现）
bind -T resize H { run-shell "w=\$(tmux display -p '##{pane_width}');  tmux resize-pane -t '#{pane_id}' -x \$((w - 5))"; switch-client -T resize }
bind -T resize J { run-shell "h=\$(tmux display -p '##{pane_height}'); tmux resize-pane -t '#{pane_id}' -y \$((h - 3))"; switch-client -T resize }
bind -T resize K { run-shell "h=\$(tmux display -p '##{pane_height}'); tmux resize-pane -t '#{pane_id}' -y \$((h - 3))"; switch-client -T resize }
bind -T resize L { run-shell "w=\$(tmux display -p '##{pane_width}');  tmux resize-pane -t '#{pane_id}' -x \$((w - 5))"; switch-client -T resize }

# =============================================================================
# copy mode
# =============================================================================
# 如果有选中文本，Esc 取消选择；如果没有，Esc 退出 copy-mode
bind-key -T copy-mode-vi Escape if-shell -F "#{selection_present}" "send-keys -X clear-selection" "send-keys -X cancel"

# --- 恢复 v 键的 begin-selection 行为（tmux 3.7 默认改为 rectangle-toggle）---
bind -T copy-mode-vi v send-keys -X begin-selection

# --- 恢复 y 键的复制并退出行为（tmux 3.7 默认无此绑定）---
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel


