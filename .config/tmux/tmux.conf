# set-option -g default-terminal 'screen-256color'
# set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1        # start indexing panes at 1 instead of 0
# set -g detach-on-destroy off     # don't exit from tmux when closing a session
# set -g escape-time 0          # prefix
# set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
# set -g status-position top       # macOS / darwin style
# set -g default-terminal "${TERM}"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on
setw -g mode-keys vi
set -g status-keys emacs          # Esc 可直接退出命令输入框
# set -g pane-active-border-style 'fg=magenta,bg=default'
# set -g pane-border-style 'fg=brightblack,bg=default'
# 
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# 通知提示，大模型停止输出5秒后tab背景变绿
set -g monitor-activity off
set -g visual-activity on
setw monitor-silence 5

# bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'mkdir -p ~/.config/tmux/plugins/tpm && git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank' # 有 set-clipboard 就不需要了
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'


# https://github.com/catppuccin/tmux/discussions/317#discussioncomment-11064512
# 透明配置：https://github.com/naivecynics/primary-tmux/blob/main/tmux.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'

# Configure Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 101
set -g status-left ""
set -ga status-left  "#{?#{==:#{pane_mode},copy-mode},#{#[fg=#{@thm_bg},bg=#{@thm_yellow},bold] COPY [#{scroll_position}/#{history_size}] #[default]},#{?client_prefix,#{#[bg=#{@thm_red},fg=default,bold]  TMUX(#S) },#{#[bg=default,fg=#{@thm_red},bold]  TMUX(#S) }}}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#{?#{e|>=:#{client_width},80},#{#[bg=default,fg=#{@thm_maroon}]  #{pane_current_command} }}"
set -ga status-left "#{?#{e|>=:#{client_width},80},#{#[bg=default,fg=#{@thm_overlay_0},none]│}}"
set -ga status-left "#[bg=default,fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#{?#{e|>=:#{client_width},70},#{#[bg=default,fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}}}"
set -ga status-left "#{?#{e|>=:#{client_width},70},#{#[bg=default,fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}}}"

# status right look and feel
set -g status-right-length 200
set -g status-right ""
set -ga status-right "#{?#{e|>=:#{client_width},80},#{#[bg=default,fg=#{@thm_red},bold] 󱐋#{?#{e|>=:20,#{battery_percentage}},#{#[bg=#{@thm_red},fg=default,bold]},#{#[bg=default,fg=#{@thm_red},bold]}} #{battery_percentage} #[bg=default,fg=#{@thm_overlay_0}, none]│}}"
set -ga status-right "#{?#{e|>=:#{client_width},80},#{#[bg=default]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#{#[fg=#{@thm_red},bold]}#[reverse] 󰖪 off }#[bg=default,fg=#{@thm_overlay_0}, none]│}}"
set -ga status-right "#{?#{e|>=:#{client_width},70},#{#[bg=default,fg=#{@thm_blue}] 󰭦 %m-%d 󰅐 %H:%M  }}"
set -ga status-right  "#{?#{e|>=:#{client_width},70},,#{#{W:#{?window_active,#{#[bg=#{@thm_peach},fg=#{@thm_bg},bold]} #I#{?#{!=:#{window_name},Window},.#W,} ,#{#[bg=default,fg=#{@thm_rosewater}]} #I#{?#{!=:#{window_name},Window},.#W,} }}}}"

# keymap (sourced before plugins so plugin bindings survive unbind-key -a)
source-file ~/.config/tmux/tmux.keymap.conf

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# message look and feel
set -g message-style "fg=#{@thm_bg},bg=#{@thm_yellow},bold,fill=#{@thm_yellow},align=left"
set -g message-command-style "fg=#{@thm_bg},bg=#{@thm_yellow},bold,fill=#{@thm_yellow},align=left"
set -g display-time 2000

# copy mode look and feel
set -g mode-style "fg=#{@thm_fg},bg=#{@thm_surface_2}"

# Configure Tmux
set -g status-position top
set -g status-style "bg=default"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=default,fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=default,fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format "#{?#{e|>=:#{client_width},70}, #I#{?#{!=:#{window_name},Window},.#W,} ,}"
set -g window-status-style "bg=default,fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=default,fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_green},fg=#{@thm_crust},bold"
set -g window-status-bell-style "bg=default,fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay_0}]"

set -g window-status-current-format "#{?#{e|>=:#{client_width},70}, #I#{?#{!=:#{window_name},Window},.#W,} ,}"
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

