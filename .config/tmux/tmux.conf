# ########################################
#
# references:
# https://github.com/catppuccin/tmux/discussions/317#discussioncomment-11064512
# https://github.com/naivecynics/primary-tmux/blob/main/tmux.conf
#
# ########################################

# ----------------------------------------
#           global settings
# ----------------------------------------

# start window/pane from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1 

# stay in tmux when closing a session
set -g detach-on-destroy off

# history of scrolling
set -g history-limit 1000000

# renumber all windows when any window is closed
set -g renumber-windows on

# system clipboard, so you don't need tmux-plugins/tmux-yank
set -g set-clipboard on

set -g status-position top

set -g extended-keys on
set -g extended-keys-format csi-u

set -g mouse on

# pase focus events so to nvim emacs etc.
# fix nvim not loading new file when it modified outside.
set -g focus-events on

# 允许 image.nvim 通过 tmux 传递 Kitty Graphics Protocol。
set -gq allow-passthrough on
set -g visual-activity off

set -g repeat-time 500

# ----------------------------------------
#           terminal config
# ----------------------------------------

# 1. Declare the internal terminal type to unlock 256 colors and italics
set -g default-terminal "tmux-256color"

# 2. Enable True Color (RGB) passthrough support
# Matches iTerm2 (xterm-256color), Ghostty (xterm-ghostty/ghostty), and Kitty (xterm-kitty)
# extkeys 让 tmux 能区分 Ctrl-数字与普通数字（用于 prefix + Ctrl-1..9）
set -as terminal-features ",xterm-256color:RGB:extkeys,xterm-ghostty:RGB:extkeys,ghostty:RGB:extkeys,xterm-kitty:RGB:extkeys"

# 3. Enable dynamic cursor shape and color changing (e.g., in Neovim modal switching)
set -as terminal-overrides ",xterm-256color:Cc=\E]12;%p1%s\a,xterm-ghostty:Cc=\E]12;%p1%s\a,xterm-kitty:Cc=\E]12;%p1%s\a"

# 4. Enable modern styling extensions (Smulx for curly/dotted underlines, Setulc for underline coloring)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ----------------------------------------
#           plugins
# ----------------------------------------

# bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'mkdir -p ~/.config/tmux/plugins/tpm && git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'sainnhe/tmux-fzf'

# ----------------------------------------
#           plugin settings
# ----------------------------------------

# FloaX：快捷键由 tmux.keymap.conf 统一管理，并与 Catppuccin Macchiato 配色统一。
# 以下选项必须在 TPM 初始化前设置。
set -g @floax-width '50%'
set -g @floax-height '50%'
set -g @floax-border-color '#f5a97f'
set -g @floax-text-color '#cad3f5'
set -g @floax-title ' C-M  s 󰘕   b 󰁌   f 󰊓   r 󰑓   e 󱂬   d    u  '
set -g @floax-session-name 'scratch'

# FloaX 使用独立 session；隐藏其中 pane 顶部的命令指示器。
# 不修改插件本身，FloaX session 创建或切换时自动应用。
set-hook -g after-new-session 'if-shell -F "#{==:#{session_name},#{@floax-session-name}}" "set-window-option -t #{session_name} pane-border-status off"'
set-hook -g client-session-changed 'if-shell -F "#{==:#{session_name},#{@floax-session-name}}" "set-window-option -t #{session_name} pane-border-status off"'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# ----------------------------------------
#           ui/catppuccin
# ----------------------------------------

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"
# Configure Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# status left look and feel
set -g status-left-length 101
set -g status-left ""
set -ga status-left  "#{?#{==:#{pane_mode},copy-mode},#{#[fg=#{@thm_bg},bg=#{@thm_yellow},bold] COPY [#{scroll_position}/#{history_size}] #[default]},#{?client_prefix,#{#[bg=#{@thm_red},fg=default,bold]  TMUX(#S) },#{#[bg=default,fg=#{@thm_red},bold]  TMUX(#S) }}}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#{?#{e|>=:#{client_width},80},#{#[bg=default,fg=#{@thm_maroon}]  #{pane_current_command} }}"
set -ga status-left "#{?#{e|>=:#{client_width},80},#{#[bg=default,fg=#{@thm_overlay_0},none]│}}"
set -ga status-left "#[bg=default,fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#{?#{e|>=:#{client_width},70},#{#[bg=default,fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}}}"
set -ga status-left "#{?#{e|>=:#{client_width},70},#{#[bg=default,fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}}}"

# status right look and feel
set -g status-right-length 200
set -g status-right ""
set -ga status-right "#{?#{e|>=:#{client_width},80},#{#[bg=default,fg=#{@thm_red},bold] 󱐋#{?#{e|>=:20,#{battery_percentage}},#{#[bg=#{@thm_red},fg=default,bold]},#{#[bg=default,fg=#{@thm_red},bold]}} #{battery_percentage} #[bg=default,fg=#{@thm_overlay_0}, none]│}}"
set -ga status-right "#{?#{e|>=:#{client_width},80},#{#[bg=default]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#{#[fg=#{@thm_red},bold]}#[reverse] 󰖪 off }#[bg=default,fg=#{@thm_overlay_0}, none]│}}"
set -ga status-right "#{?#{e|>=:#{client_width},70},#{#[bg=default,fg=#{@thm_blue}] 󰭦 %m-%d 󰅐 %H:%M  }}"

# narrow terminal's window indicator
set -ga status-right  "#{?#{e|>=:#{client_width},70},,#{#{W:#{?window_active,#{#[bg=#{@thm_peach},fg=#{@thm_bg},bold]} #I#{?#{!=:#{window_name},},.#W,} ,#{#[bg=default,fg=#{@thm_rosewater}]} #I#{?#{!=:#{window_name},},.#W,} }}}}"


# bell notification
set -g bell-action any
set -g visual-bell on
setw -g monitor-bell on
set -g window-status-bell-style "bg=#{@thm_green},fg=#{@thm_bg},bold"

# Configure Tmux
set -g status-style "bg=default"
set -g status-justify "absolute-centre"

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format "#{?#{e|>=:#{client_width},70}, #I#{?#{!=:#{window_name},},.#W,} ,}"
set -g window-status-style "bg=default,fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=default,fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_crust},bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay_0}]"
set -g window-status-current-format "#{?#{e|>=:#{client_width},70}, #I#{?#{!=:#{window_name},},.#W,} ,}"
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# ----------------------------------------
#           temp
# ----------------------------------------

# ----------------------------------------
#           must after tpm
# ----------------------------------------

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# restore session
set -g @continuum-restore 'on'

# message look and feel
set -g message-style "fg=#{@thm_bg},bg=#{@thm_yellow},bold,fill=#{@thm_yellow},align=left"
set -g message-command-style "fg=#{@thm_bg},bg=#{@thm_yellow},bold,fill=#{@thm_yellow},align=left"
set -g display-time 2000

# copy mode look and feel
set -g mode-style "fg=#{@thm_fg},bg=#{@thm_surface_2}"

# 开启顶部边框状态栏
set -g pane-border-status top
set -g pane-border-lines simple # single ─, double ═, heavy ━, simple -, number, spaces
set -g pane-border-style "fg=#{@thm_surface_1},bg=default"
set -g pane-active-border-style "fg=#{@thm_surface_1},bg=default"
set -g pane-border-format "#{?pane_active,#[bg=default]#[fg=#{@thm_peach}]#[bold],#{?pane_last,#[bg=default]#[fg=#{@thm_peach}]#[bold],#[bg=default]#[fg=#{@thm_yellow}]#[nobold]}} 󰘧 P.#P #{s|^.*@[^ ]* ||:#{pane_title}} #[bg=default]"


# ----------------------------------------
#           tail
# ----------------------------------------

# Load the custom keymap after plugins so it can intentionally replace plugin bindings.
source-file ~/.config/tmux/tmux.keymap.conf

# Optional machine- and user-specific overrides (not tracked).
source-file -q ~/.config/tmux/tmux.local.conf

